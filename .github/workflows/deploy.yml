name: Deploy to GitHub Pages

# LP の生成物に影響しない文書・Issue テンプレートだけの更新では再デプロイしない。
# デプロイは required check ではないため、push の paths フィルターで安全に省略できる。
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同時実行は最新の 1 本に集約 (進行中のデプロイはキャンセルしない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        # og.png と apple-touch-icon.png は Git 非管理。デプロイ環境（Ubuntu）で生成する。
        run: pnpm run og && pnpm run icons

      - name: Build with Astro
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        # base/site は astro.config.mjs で設定済みのため引数指定は不要
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
          # 本体リポジトリ (code-tactics) の公開後、この repository variable を
          # true にするだけで通常リンクへ戻す「ワンステップ復帰」の配線 (#209)。
          PUBLIC_REPO_PUBLIC: ${{ vars.PUBLIC_REPO_PUBLIC }}

      # PUBLIC_CF_BEACON_TOKEN の secret が空文字列にリセットされる、
      # Layout.astro の分岐が壊れるなどの事故が起きても、ビルドは成功し続け
      # ビーコンが黙って出なくなる (#205)。ci.yml はこのトークンを渡さない
      # ため、本番ビルドを行うこのジョブでのみ検証する。
      - name: Check beacon output gate
        run: pnpm run check:beacon-gate
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}

      # ci.yml の repo-gate 検証は PUBLIC_REPO_PUBLIC を実際には設定せず
      # 未公開/公開の両分岐をハードコードで再現しているだけで、本番ビルドの
      # 実配線 (vars.PUBLIC_REPO_PUBLIC) は検証していない (#209)。ここで
      # 実際のビルド成果物に対して同じゲートを走らせる。
      - name: Check repo visibility gate
        run: pnpm run check:repo-gate

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN に Pages デプロイ権限を付与（このジョブでのみ必要な最小権限に絞る）
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
