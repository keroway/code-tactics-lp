name: CI

# PR 段階で型チェック / lint / format / build を並列ジョブで検証する。
# 壊れた変更が main にマージされるのを防ぐゲート。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check)
        run: pnpm run astro check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Format check (Prettier for .astro / .md)
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

  # axe-core でアクセシビリティ違反の具体的箇所を検出する。
  # Lighthouse CI の a11y スコア閾値チェックとは相補的な役割（こちらは違反ルールと対象要素を特定する）。
  a11y:
    name: A11y check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm run build

      - name: Start preview server
        run: nohup pnpm run preview > preview.log 2>&1 &

      - name: Wait for server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4321/code-tactics-lp/ >/dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "preview server did not start in time" >&2
          cat preview.log >&2 || true
          exit 1

      - name: A11y check (axe-core)
        run: pnpm run smoke:a11y

  # ビルド成果物をプレビュー配信し、内部アンカー・外部リンク・アセットの死活を検証する。
  # サブパス (/code-tactics-lp/) 配信を実環境同様に再現するため、ファイル直読みではなく
  # preview サーバー経由で検査する。
  linkcheck:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        run: pnpm run og && pnpm run icons

      - name: Build
        run: pnpm run build

      - name: Start preview server
        run: nohup pnpm run preview > preview.log 2>&1 &

      - name: Wait for server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4321/code-tactics-lp/ >/dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "preview server did not start in time" >&2
          cat preview.log >&2 || true
          exit 1

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee.toml の設定 (リトライ/タイムアウト/許容コード/除外) を併用する。
          # --include-fragments で内部アンカー (#concept 等) の存在も検証する。
          args: "--no-progress --include-fragments http://localhost:4321/code-tactics-lp/"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
