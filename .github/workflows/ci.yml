name: CI

# すべての PR で静的解析・書式検査を行い、サイトに影響する差分に限って
# ビルド後のブラウザ検証を実行する。paths フィルターを workflow 自体に付けると
# required check が Pending のままになるため、常に起動して job 単位で判定する。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect site changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # 手動実行では比較対象がないため、意図どおり全検証を実行する。
          if [[ -z "$BASE_SHA" ]]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed_files"
          if grep -Eq '^(src/|public/|scripts/|astro\.config\.mjs$|tsconfig\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|lighthouserc\.json$|lychee\.toml$|\.github/workflows/ci\.yml$|\.github/workflows/deploy\.yml$)' <<<"$changed_files"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm run lint
      - name: Format check (Prettier for .astro / .md)
        run: pnpm run format:check
      # CI ゲートスクリプト (check-*.mjs) 自体のフィクスチャテスト (#217)。
      # ビルド不要でフィクスチャのみを使うため、build ジョブより先に実行できる。
      - name: Unit tests (CI gate scripts)
        run: pnpm run test

  build:
    name: Build and type check
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (astro check)
        run: pnpm run astro check
      - name: Generate deployment assets
        run: pnpm run og && pnpm run icons
      - name: Build
        run: pnpm run build
      # REPO_IS_PUBLIC ゲートの漏れを検出する (#143)。lychee のリンク検査は
      # lychee.toml で本体リポジトリの URL を除外しているため、この検査が
      # 無いと漏れても誰も気づけない。dist/ を直接見るだけなので preview
      # サーバーの起動は不要で、ビルド直後に置くのが最も早く落ちる。
      - name: Check repo visibility gate
        run: pnpm run check:repo-gate
      # Hero 動画アセットの静止画フォールバックが誤って発火していないかを検出する (#170)。
      # 3ファイルは git 管理下の実アセットなので、欠落は常にビルド事故であり、
      # 静止画へ静かにフォールバックされても他のジョブでは気づけない。
      - name: Check hero video asset gate
        run: pnpm run check:hero-video
      # sitemap-index.xml / sitemap-0.xml と robots.txt の Sitemap: 行の整合を
      # 検証する (#215)。site / base の変更漏れや収録ページの過不足が
      # 誰にも気づかれず出荷されるのを防ぐ。
      - name: Check sitemap gate
        run: pnpm run check:sitemap
      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
      # 公開側の分岐も CI で実行する。CI は PUBLIC_REPO_PUBLIC を設定しないため、
      # 上の検査だけだと**未公開側しか通らず、公開側の判定は CI 上で死んでいる**。
      # 本体を public 化して env を deploy にだけ設定した場合、この分岐が壊れて
      # いても気づけないことになる。
      #
      # matrix にせず再ビルドで済ませているのは、成果物名 (site-dist) が衝突し、
      # 後続の A11y / Link check ジョブがどちらを受け取るか曖昧になるため。
      # このステップは成果物アップロードの後に置いてあるので、dist/ を
      # 上書きしても影響しない。
      - name: Check repo visibility gate (public mode)
        env:
          PUBLIC_REPO_PUBLIC: "true"
        run: pnpm run build && pnpm run check:repo-gate

  # axe-core は違反ルールと対象要素を報告し、Lighthouse のスコア閾値を補完する。
  a11y:
    name: A11y check
    needs: [changes, build]
    if: needs.changes.outputs.site == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Start preview server
        run: nohup pnpm run preview > preview.log 2>&1 &
      - name: Wait for server
        run: bash scripts/wait-for-preview.sh
      - name: A11y check (axe-core)
        run: pnpm run smoke:a11y

  # ビルド済み成果物をサブパス配信し、リンク・アンカー・アセットを検証する。
  linkcheck:
    name: Link check
    needs: [changes, build]
    if: needs.changes.outputs.site == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Start preview server
        run: nohup pnpm run preview > preview.log 2>&1 &
      - name: Wait for server
        run: bash scripts/wait-for-preview.sh
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --include-fragments http://localhost:4321/code-tactics-lp/ http://localhost:4321/code-tactics-lp/privacy/ http://localhost:4321/code-tactics-lp/404.html"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
