# osv-scanner の無視リスト。設定形式: https://google.github.io/osv-scanner/configuration/
#
# 各エントリは「修正版が存在しない」「実行時に到達しない (devDependency のみ)」等、
# override では解消できない既知脆弱性を対象とする。安易な追加を防ぐため、
# 追加時は必ず出典 Issue と再評価条件を reason に書く。
