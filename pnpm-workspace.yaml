# サプライチェーン保護水準をワークスペース全体で統一 (agent-assets#171、2026-08-14決定)。
# pnpm 11 既定の minimumReleaseAge (1440分=1日) を 3日 (4320分) に固定し、
# 制約を満たすバージョンが無いときに resolve を失敗させる minimumReleaseAgeStrict も有効化する。
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
# time フィールドを持たないレジストリ/ミラー経由でも age チェックを素通りさせない
# (既定 true だと time 欠落パッケージが無条件で許可される)。
minimumReleaseAgeIgnoreMissingTime: false

# esbuild の postinstall はネイティブバイナリの検証のみのため許可する
allowBuilds:
  esbuild: true
  # lefthook の postinstall は git hooks のインストールのため許可する
  lefthook: true

# @lhci/cli (devDependency) の推移的依存に既知脆弱性 (osv-scanner 検出)。
# @lhci/cli 自体は 0.15.1 が最新で直接の修正版は無いため、patch/minor 範囲で上書きする。
overrides:
  # GHSA-rgw5-rvv9-x895 で 5.0.8 も脆弱になったため下限を引き上げた（旧: ">=1.1.17"）。
  # この override により minimatch@3 系が引く 1.x も 5.x に統一される。
  brace-expansion: ">=5.0.9 <6"
  tmp: ">=0.2.4"
  uuid: ">=9"
  # osv-scanner 検出分（2026-08-09、#139）。
  # GHSA-7p8r-x3mc-p8w7 (fast-uri <3.1.5) — backslash authority introducer による host confusion。
  #   ajv > yaml-language-server > @astrojs/language-server > @astrojs/check 経由（型チェック時のみ）。
  # 2026-09-03: 新規 High advisory 4 件 (IDN canonicalization / IPv6 normalization /
  #   percent-decoding SSRF / percent-encoded scheme。vuln <3.1.6、patched >=3.1.6) に
  #   対応し下限を引き上げ。
  fast-uri: ">=3.1.6 <4"
  # GHSA-22jq-vg5j-6vgg / GHSA-4xrf-jv44-h6hh / GHSA-mwp4-54f8-5fhr (ip-address)
  #   — @lhci/cli / lighthouse > puppeteer-core > proxy-agent > socks 経由。
  ip-address: ">=10.3.1 <11"
  # GHSA-2v37-7h3g-55p8 (nanoid <3.3.17) — size=0 で customAlphabet / customRandom が無限ループする。
  #   postcss（ソースマップ用 ID 生成、size は固定）経由。advisory の影響範囲が
  #   2026-08-08 に 3.3.16 まで拡大されたため追加。
  nanoid: ">=3.3.17 <4"
  # GHSA-fxqj-rqcc-2cmp (postcss <8.5.23) — vite > @tailwindcss/vite / astro 経由（ビルド時のみ）。
  postcss: ">=8.5.23 <9"
  # GHSA-5p4m-2wfm-xmqj (js-yaml <4.3.1 / <3.15.1) — !!omap 解決の二次計算量 DoS。
  #   3.x 系は @lhci/cli 系、4.x 系は @astrojs/internal-helpers > astro 経由。
  #   系統ごとに範囲を分ける（片方だけ広く指定すると他方を非互換な major へ飛ばすため）。
  "js-yaml@>=3.0.0 <4": ">=3.15.1 <4"
  "js-yaml@>=4.0.0 <5": ">=4.3.1 <5"